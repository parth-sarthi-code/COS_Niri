# Fuzzel configuration file
# Modern, clean aesthetic matching Niri theme palette

font=Adwaita Mono:size=15, Symbols Nerd Font Mono:size=15
dpi-aware=yes
prompt="󰍉  "
placeholder="Search..."
password-character=*
show-actions=yes
terminal=alacritty
exit-on-keyboard-focus-loss=yes
layer=overlay
icon-theme=Papirus-Dark
icons-enabled=yes
image-size-ratio=0.2

# Style
lines=9
width=40
tabs=8
horizontal-pad=35
vertical-pad=23
inner-pad=12

# Dynamic Colors Include
include=~/.config/cos-niri/fuzzel-colors.ini

[border]
width=2
radius=12
